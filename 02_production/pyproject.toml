[project]
name = "tic-tac-toe-production"
version = "0.1.0"
description = "Учебное production-like API крестиков-ноликов"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17,<2.0",
    "asyncpg>=0.30,<1.0",
    "email-validator>=2.3,<3.0",
    "fastapi>=0.120,<1.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "pydantic-settings>=2.11,<3.0",
    "pyjwt>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0.44,<2.2",
    "uvicorn[standard]>=0.35,<1.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
